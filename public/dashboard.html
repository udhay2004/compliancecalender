<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Compliance Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  .hero { padding-top: 40px; }
  .hero h1 { font-family: var(--serif); font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .hero p { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .role-pill {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; padding: 4px 10px; border-radius: 999px;
    background: var(--teal-bg); color: var(--brand-dark); margin-bottom: 10px;
  }
  .role-pill.owner { background: var(--seal-gold-bg); color: var(--seal-gold); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 22px; }
  .stat {
    background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow-sm);
  }
  .stat-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
  .stat-value { font-family: var(--serif); font-size: 30px; font-weight: 700; margin: 8px 0 4px; letter-spacing: -0.02em; }
  .stat-value.good { color: var(--brand-dark); }
  .stat-value.warn { color: var(--seal-gold); }
  .stat-value.bad  { color: var(--stamp-red); }
  .stat-hint { font-size: 12px; color: var(--grey-dot); line-height: 1.5; }

  .panel { margin-top: 40px; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .panel-head h2 { font-family: var(--serif); font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  .panel-head .panel-sub { font-size: 13px; color: var(--ink-soft); }

  table.data { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  table.data th {
    text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--ink-soft); padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--grey-bg);
  }
  table.data td { padding: 13px 16px; font-size: 13.5px; border-bottom: 1px solid var(--rule-soft); vertical-align: middle; }
  table.data tr:last-child td { border-bottom: 0; }
  table.data td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-scroll { overflow-x: auto; }

  .bar-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .bar-label { flex: 0 0 160px; font-size: 13.5px; color: var(--ink); }
  .bar-track { flex: 1; height: 9px; background: var(--grey-bg); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--brand); border-radius: 999px; transition: width .4s ease; }
  .bar-count { flex: 0 0 46px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-soft); }

  .muted { color: var(--grey-dot); font-size: 13.5px; padding: 26px 0; text-align: center; }
  .ghost-btn {
    background: none; border: 1px solid var(--rule); border-radius: var(--radius-sm);
    padding: 6px 12px; font-size: 12.5px; font-family: var(--sans); cursor: pointer; color: var(--ink-soft);
  }
  .ghost-btn:hover { border-color: var(--stamp-red); color: var(--stamp-red); }
  .feed { list-style: none; padding: 0; margin: 0; }
  .feed li { padding: 12px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13.5px; line-height: 1.55; }
  .feed li:last-child { border-bottom: 0; }
  .feed .feed-meta { color: var(--grey-dot); font-size: 12px; margin-top: 3px; }
  .skeleton { color: var(--grey-dot); padding: 60px 0; text-align: center; font-size: 14px; }
  .section-heading { margin: 48px 0 -8px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-dark); border-top: 1px solid var(--rule); padding-top: 18px; }
  .fin-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; margin-top: 8px; align-items: start; }
  .fin-col { min-width: 0; }
  .fin-panel { margin-top: 32px; }
  .fin-head h2 { font-family: var(--serif); font-size: 18px; margin: 0; }
  .fin-head p { font-size: 13px; color: var(--ink-soft); margin: 4px 0 12px; line-height: 1.5; }
  .fin-list { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
  .fin-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 13px 16px; border-bottom: 1px solid var(--rule-soft); text-decoration: none; color: inherit; }
  .fin-row:last-child { border-bottom: 0; }
  .fin-row:hover { background: var(--paper); }
  .fin-row:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .fin-main { min-width: 0; }
  .fin-title { font-weight: 600; font-size: 14px; color: var(--brand-dark); overflow-wrap: anywhere; }
  .fin-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; overflow-wrap: anywhere; }
  .fin-side { text-align: right; flex-shrink: 0; max-width: 45%; }
  .fin-amt { font-family: var(--serif); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .fin-amt.good { color: var(--brand-dark); }
  .fin-amt.bad { color: var(--stamp-red); }
  .fin-pill { display: inline-block; font-family: var(--sans); font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--grey-bg); color: var(--ink-soft); }
  .fin-pill.ready { background: var(--seal-gold-bg); color: var(--seal-gold); }
  .fin-pill.bad { background: var(--stamp-red-bg); color: var(--stamp-red); }
  .fin-pill.done { background: var(--teal-bg); color: var(--brand-dark); }
  .fin-empty { background: var(--card); border: 1px dashed var(--rule); border-radius: var(--radius); padding: 22px 16px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
  .fin-list.price { padding: 4px 16px; }
  .fin-price-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13px; }
  .fin-price-row:last-child { border-bottom: 0; }
  .fin-price-row b { white-space: nowrap; text-align: right; }
  .fin-price-row b.quote, .fin-price-row b.included, .fin-price-row b.from { font-weight: 500; color: var(--ink-soft); white-space: normal; max-width: 50%; }
  @media (max-width: 1020px) { .fin-grid { grid-template-columns: minmax(0, 1fr); gap: 0; } }
  @media (max-width: 720px) {
    .bar-label { flex-basis: 120px; }
    table.data, table.data tbody, table.data tr, table.data td { display: block; width: 100%; }
    table.data thead { display: none; }
    table.data tr { border-bottom: 1px solid var(--rule); padding: 8px 0; }
    table.data td { border: 0; padding: 4px 14px; text-align: left !important; }
    table.data td[data-label]:not([data-label=""])::before { content: attr(data-label); display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); }
    .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stat { padding: 14px 14px; }
    .stat-label { font-size: 10.5px; }
    .stat-value { font-size: 22px; margin: 6px 0 2px; }
    .stat-hint { font-size: 11px; }
    .hero h1 { font-size: 23px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><a href="/dashboard.html">Compliance Calendar <strong>Generator</strong></a></div>
  <div class="nav-links" id="navLinks"></div>
  <div class="nav-user">
    <span id="navUser"></span>
    <button type="button" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="wrap">
  <div id="root"><div class="skeleton">Loading your dashboard…</div></div>
</div>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }

  // Everything from the server is escaped before it reaches the DOM.
  // Company names, filing names and audit summaries are all
  // user-supplied somewhere upstream, so dropping them into innerHTML
  // raw would be a stored-XSS hole — and on an admin page, XSS means
  // whoever planted it acts as the super admin.
  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function money(amount) {
    return '$' + Number(amount || 0).toLocaleString('en-US', {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    });
  }

  function when(value) {
    if (!value) return '—';
    var d = new Date(value);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  var ROLE_LABEL = {
    staff: 'Staff', admin: 'Administrator', super_admin: 'Super admin'
  };
  var DEPT_LABEL = { tech: 'Tech', finance: 'Finance' };

  function statCards(cards) {
    return '<div class="stat-grid">' + cards.map(function (c) {
      var value = c.money ? money(c.value) : esc(c.value);
      return '<div class="stat">' +
        '<div class="stat-label">' + esc(c.label) + '</div>' +
        '<div class="stat-value ' + esc(c.tone || '') + '">' + value + '</div>' +
        '<div class="stat-hint">' + esc(c.hint || '') + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function panel(title, sub, body) {
    return '<section class="panel">' +
      '<div class="panel-head"><h2>' + esc(title) + '</h2>' +
      (sub ? '<span class="panel-sub">' + esc(sub) + '</span>' : '') + '</div>' +
      body + '</section>';
  }

  function table(headers, rows, emptyMessage) {
    if (!rows.length) return '<div class="muted">' + esc(emptyMessage) + '</div>';
    return '<div class="table-scroll"><table class="data"><thead><tr>' +
      headers.map(function (h) {
        return '<th' + (h.num ? ' style="text-align:right"' : '') + '>' + esc(h.label) + '</th>';
      }).join('') +
      '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }

  function bars(items) {
    var max = items.reduce(function (m, i) { return Math.max(m, i.value); }, 0) || 1;
    return '<div>' + items.map(function (i) {
      return '<div class="bar-row">' +
        '<div class="bar-label">' + esc(i.label) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + ((i.value / max) * 100).toFixed(1) + '%"></div></div>' +
        '<div class="bar-count">' + esc(i.value) + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  // ------------------------------------------------------------------
  function renderTech(tech) {
    var html = statCards(tech.cards);

    html += finPanel('Deadlines', 'Services clients chose that are overdue or due in the next 30 days. Dates are worked out automatically, including weekends and US holidays.',
      rows(tech.deadlines, function (r) {
        var d = new Date(r.dueDate);
        var label = r.days < 0 ? (-r.days) + ' day' + (r.days === -1 ? '' : 's') + ' overdue' : r.days === 0 ? 'due today' : r.days === 1 ? 'due tomorrow' : 'in ' + r.days + ' days';
        return row('/calendar.html?id=' + encodeURIComponent(r.calendarId) + '#item-' + encodeURIComponent(r.itemIndex),
          esc(r.company), esc(r.task) + ' \u00b7 ' + esc(r.status),
          d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }),
          '<span class="fin-pill ' + (r.days < 0 ? 'bad' : r.days <= 7 ? 'ready' : '') + '">' + esc(label) + '</span>',
          r.days < 0 ? 'bad' : '');
      }, 'Nothing overdue or due in the next 30 days.'));

    if (tech.needsDate && tech.needsDate.length) {
      html += finPanel('Needs a due date', 'The due date for these couldn\u2019t be worked out automatically. Open each one and set the date by hand.',
        rows(tech.needsDate, function (r) {
          return row('/calendar.html?id=' + encodeURIComponent(r.calendarId) + '#item-' + encodeURIComponent(r.itemIndex),
            esc(r.company), esc(r.task), '<span class="fin-pill">Set date</span>', esc(r.dueText || ''));
        }, ''));
    }

    html += panel('Documents waiting for verification', 'Oldest first. Open the calendar to download, verify or reject.',
      table(
        [{ label: 'Company' }, { label: 'Service' }, { label: 'Document' }, { label: 'Uploaded' }],
        (tech.pendingDocuments || []).map(function (d) {
          return '<tr>' +
            '<td><a href="/calendar.html?id=' + encodeURIComponent(d.calendarId) + '">' + esc(d.company) + '</a></td>' +
            '<td>' + esc(d.task) + '</td>' +
            '<td>' + esc(d.fileName) + (d.requirement ? '<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">' + esc(d.requirement) + '</div>' : '') + '</td>' +
            '<td>' + esc(when(d.uploadedAt)) + '</td>' +
          '</tr>';
        }),
        'Nothing to verify right now.'
      ));

    html += panel('Clients', 'Services each client selected, and what is waiting on the team',
      table(
        [{ label: 'Company' }, { label: 'Selected' }, { label: 'To verify' }, { label: 'Ready for a price' }, { label: 'Awaiting payment' }],
        (tech.clientWork || []).map(function (c) {
          return '<tr>' +
            '<td><a href="/calendar.html?id=' + encodeURIComponent(c.calendarId) + '">' + esc(c.company) + '</a>' +
              (c.hasPhone ? '' : '<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">No phone on file</div>') + '</td>' +
            '<td>' + esc(c.selected) + ' of ' + esc(c.total) + '</td>' +
            '<td>' + (c.toVerify ? '<b>' + esc(c.toVerify) + '</b>' : '0') + '</td>' +
            '<td>' + (c.readyToQuote ? '<b>' + esc(c.readyToQuote) + '</b>' : '0') + '</td>' +
            '<td>' + esc(c.awaitingPayment) + '</td>' +
          '</tr>';
        }),
        'No client calendars yet.'
      ));

    html += panel('Where every filing stands', 'Across all client organisations',
      bars(tech.filingStatus));

    html += panel('Recently generated calendars', '',
      table(
        [{ label: 'Company' }, { label: 'Status' }, { label: 'Generated by' }, { label: 'When' }],
        tech.recentCalendars.map(function (c) {
          return '<tr>' +
            '<td><a href="/calendar.html?id=' + encodeURIComponent(c.id) + '">' + esc(c.company) + '</a></td>' +
            '<td><span class="badge ' + esc(c.status) + '">' + esc(c.status.replace(/_/g, ' ')) + '</span></td>' +
            '<td>' + esc(c.createdBy) + '</td>' +
            '<td>' + esc(when(c.createdAt)) + '</td>' +
          '</tr>';
        }),
        'No calendars generated yet.'
      ));
    return html;
  }

  // Finance: compact rows instead of wide tables, so nothing ever needs a
  // sideways scroll; each row opens that client's calendar.
  function daysAgo(value) {
    if (!value) return '';
    var d = Math.floor((Date.now() - new Date(value).getTime()) / 86400000);
    return d <= 0 ? 'today' : d === 1 ? '1 day ago' : d + ' days ago';
  }
  function calLink(id) { return '/calendar.html?id=' + encodeURIComponent(id); }
  function rows(list, fn, empty) {
    if (!list || !list.length) return '<div class="fin-empty">' + esc(empty) + '</div>';
    return '<div class="fin-list">' + list.map(fn).join('') + '</div>';
  }
  function row(href, title, sub, right, rightSub, tone) {
    return '<a class="fin-row" href="' + href + '">' +
      '<div class="fin-main"><div class="fin-title">' + title + '</div><div class="fin-sub">' + sub + '</div></div>' +
      '<div class="fin-side"><div class="fin-amt ' + (tone || '') + '">' + right + '</div>' + (rightSub ? '<div class="fin-sub">' + rightSub + '</div>' : '') + '</div>' +
    '</a>';
  }
  function finPanel(title, sub, body) {
    return '<section class="fin-panel"><div class="fin-head"><h2>' + esc(title) + '</h2>' +
      (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>' + body + '</section>';
  }

  function renderFinance(finance) {
    var html = statCards(finance.cards);
    html += '<div class="fin-grid">';

    html += '<div class="fin-col">';
    html += finPanel('Needs a price', 'Services clients chose that have no price in your list. Clients were told you\u2019ll contact them once their documents are in.',
      rows(finance.needsPrice, function (r) {
        return row(calLink(r.calendarId),
          esc(r.company),
          esc(r.task),
          r.ready ? '<span class="fin-pill ready">Documents in</span>' : '<span class="fin-pill">' + esc(r.docsProvided) + '/' + esc(r.docsTotal) + ' documents</span>',
          r.listLabel && r.listLabel !== 'Price on request' ? 'List: ' + esc(r.listLabel) : 'Not in price list');
      }, 'Every selected service has a price. Nothing to do here.'));

    html += finPanel('Ready to complete', 'Paid services still to be done. Open one, do the work, then upload the proof: that marks it done and notifies the client.',
      rows(finance.readyToComplete, function (r) {
        return row(calLink(r.calendarId) + '#item-' + encodeURIComponent(r.itemIndex),
          esc(r.company),
          esc(r.task) + (r.dueDate ? ' \u00b7 due ' + esc(r.dueDate) : ''),
          '<span class="fin-pill ready">Upload proof</span>',
          'paid ' + esc(daysAgo(r.paidAt)) + (r.amount ? ' \u00b7 ' + money(r.amount) : ''));
      }, 'Nothing waiting. Every paid service has been completed.'));

    html += finPanel('Waiting for payment', 'Overdue first, then the longest waiting.',
      rows(finance.outstanding, function (r) {
        var overdue = r.paymentStatus === 'Overdue';
        return row(calLink(r.calendarId),
          esc(r.company),
          esc(r.task) + ' \u00b7 due ' + esc(r.dueDate || '\u2014'),
          money(r.amount),
          (overdue ? '<span class="fin-pill bad">Overdue</span> ' : '') + (r.quotedAt ? 'priced ' + esc(daysAgo(r.quotedAt)) : '') + (r.autoPriced ? ' \u00b7 from list' : ''),
          overdue ? 'bad' : '');
      }, 'Nothing outstanding. Everything priced has been paid.'));
    html += '</div>';

    html += '<div class="fin-col">';
    html += finPanel('Recent payments', '',
      rows(finance.recentPaid, function (r) {
        return row(calLink(r.calendarId), esc(r.company), esc(r.task), money(r.amount), esc(when(r.paidAt)), 'good');
      }, 'No payments recorded yet.'));

    html += finPanel('Recently completed', '',
      rows(finance.recentlyCompleted, function (r) {
        return row(calLink(r.calendarId) + '#item-' + encodeURIComponent(r.itemIndex), esc(r.company), esc(r.task),
          '<span class="fin-pill done">Done</span>',
          esc(when(r.completedAt)) + (r.completedByName ? ' \u00b7 ' + esc(r.completedByName) : '') + ' \u00b7 ' + esc(r.proofs) + ' proof' + (r.proofs === 1 ? '' : 's'));
      }, 'Nothing completed yet.'));

    html += finPanel('Price list', 'Fixed prices are added automatically when a client selects the service. Edit them in lib/complianceFees.js.',
      '<div class="fin-list price">' + (finance.priceList || []).map(function (p) {
        return '<div class="fin-price-row"><span>' + esc(p.service) + '</span><b class="' + esc(p.kind) + '">' + esc(p.label) + '</b></div>';
      }).join('') + '</div>');
    html += '</div>';

    html += '</div>';
    return html;
  }

  // Tables elsewhere on the dashboard: label each cell so they can stack
  // into cards on a phone instead of scrolling sideways.
  function labelTableCells(root) {
    root.querySelectorAll('table.data').forEach(function (t) {
      var heads = Array.prototype.map.call(t.querySelectorAll('thead th'), function (th) { return th.textContent.trim(); });
      t.querySelectorAll('tbody tr').forEach(function (tr) {
        Array.prototype.forEach.call(tr.children, function (td, i) { if (heads[i]) td.setAttribute('data-label', heads[i]); });
      });
    });
  }

  function renderOwner(owner) {
    var html = statCards(owner.cards);

    html += panel('Team accounts', 'Only you can see or reset these',
      table(
        [{ label: 'Person' }, { label: 'Role' }, { label: 'Team' }, { label: 'Last signed in' }, { label: '' }],
        owner.team.map(function (u) {
          var status = !u.active
            ? '<span class="badge rejected">deactivated</span>'
            : (u.mustSetPassword ? '<span class="badge pending_review">setup pending</span>' : '');
          return '<tr>' +
            '<td>' + esc(u.name || u.email) + '<div class="stat-hint">' + esc(u.email) + '</div></td>' +
            '<td>' + esc(ROLE_LABEL[u.role] || u.role) + ' ' + status + '</td>' +
            '<td>' + esc(DEPT_LABEL[u.department] || '—') + '</td>' +
            '<td>' + esc(when(u.lastLoginAt)) + '</td>' +
            '<td class="num"><button type="button" class="ghost-btn" data-reset="' + esc(u.id) + '">Force re-setup</button></td>' +
          '</tr>';
        }),
        'No team accounts yet.'
      ));

    html += panel('Security and activity log', 'Most recent 15 events',
      owner.audit.length
        ? '<ul class="feed">' + owner.audit.map(function (a) {
            return '<li>' + esc(a.summary) +
              '<div class="feed-meta">' + esc(a.actor) + ' · ' + esc(a.action.replace(/_/g, ' ')) + ' · ' + esc(when(a.at)) + '</div>' +
            '</li>';
          }).join('') + '</ul>'
        : '<div class="muted">Nothing logged yet.</div>');

    return html;
  }

  // ------------------------------------------------------------------
  function render(data) {
    var user = data.user;
    var isOwner = user.role === 'super_admin';
    var teamName = user.department ? DEPT_LABEL[user.department] : ROLE_LABEL[user.role];

    var html = '<div class="hero">' +
      '<div class="role-pill' + (isOwner ? ' owner' : '') + '">' +
        esc(ROLE_LABEL[user.role] || user.role) + (user.department ? ' · ' + esc(DEPT_LABEL[user.department]) : '') +
      '</div>' +
      '<h1>' + esc(user.name || teamName) + '\u2019s dashboard</h1>' +
      '<p>Signed in as ' + esc(user.email) + '. Last sign-in ' + esc(when(user.lastLoginAt)) + '.</p>' +
    '</div>';

    // Order matters for the mixed roles: an admin sees delivery work
    // first because that's the day job, money second.
    var many = [data.tech, data.finance, data.owner].filter(Boolean).length > 1;
    function heading(t) { return many ? '<div class="section-heading">' + esc(t) + '</div>' : ''; }
    if (data.tech) html += heading('Client work') + renderTech(data.tech);
    if (data.finance) html += heading('Finance') + renderFinance(data.finance);
    if (data.owner) html += heading('Team & security') + renderOwner(data.owner);

    $('root').innerHTML = html;
    labelTableCells($('root'));

    $('navUser').textContent = user.email;
    var links = [
      { href: '/app.html', label: 'Generate' },
      { href: '/review.html', label: 'Review queue' }
    ];
    if (user.role === 'admin' || user.role === 'super_admin') {
      links.push({ href: '/admin.html', label: 'Administration' });
    }
    $('navLinks').innerHTML = links.map(function (l) {
      return '<a href="' + esc(l.href) + '">' + esc(l.label) + '</a>';
    }).join('');

    // Wired after innerHTML, since the buttons don't exist before it.
    var resets = document.querySelectorAll('[data-reset]');
    for (var i = 0; i < resets.length; i++) {
      resets[i].addEventListener('click', onReset);
    }
  }

  function onReset() {
    var id = this.getAttribute('data-reset');
    if (!confirm('This signs that person out everywhere and clears their password. They will have to sign in with an email code and choose a new one. Continue?')) return;
    var btn = this;
    btn.disabled = true;
    fetch('/api/dashboard/team/' + encodeURIComponent(id) + '/reset', {
      method: 'PATCH',
      credentials: 'same-origin'
    })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || 'Reset failed.');
        return d;
      }); })
      .then(function (d) { alert(d.message); load(); })
      .catch(function (err) { alert(err.message); btn.disabled = false; });
  }

  function load() {
    fetch('/api/dashboard/summary', { credentials: 'same-origin' })
      .then(function (res) {
        // A 401 here means the session died while the tab was open —
        // send them back to sign in rather than showing a broken page.
        if (res.status === 401 || res.status === 403) {
          location.href = '/login.html?reason=session_expired';
          throw new Error('redirecting');
        }
        return res.json();
      })
      .then(render)
      .catch(function (err) {
        if (err.message === 'redirecting') return;
        $('root').innerHTML = '<div class="muted">Couldn\u2019t load the dashboard. Please refresh.</div>';
      });
  }

  document.addEventListener('cc:notifications', function () { load(); });
  $('logoutBtn').addEventListener('click', function () {
    fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
      .then(function () { location.href = '/login.html'; });
  });

  load();
})();
</script>
<script src="/js/notifications.js" defer></script>
</body>
</html>
