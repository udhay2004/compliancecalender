<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads · Compliance Calendar by ComplyGlobally</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css?v=20261008">
<style>
  .hero { padding-top: 36px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .hero h1 { font-family: var(--serif); font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .hero p { color: var(--ink-soft); font-size: 14px; margin: 0; max-width: 70ch; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .controls label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
  .controls input, .controls select { font: inherit; font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); color: var(--ink); min-width: 220px; }
  .controls select { min-width: 0; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 24px; }
  .kpi { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-sm); }
  .kpi .l { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); }
  .kpi .v { font-family: var(--serif); font-size: 26px; font-weight: 700; margin: 6px 0 2px; font-variant-numeric: tabular-nums; color: var(--ink); }

  .box { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 6px 16px; margin-top: 24px; overflow-x: auto; }
  table.rt { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.rt th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); padding: 10px 10px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  table.rt td { padding: 10px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; overflow-wrap: anywhere; }
  table.rt tr:last-child td { border-bottom: 0; }
  table.rt .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.rt a { color: var(--brand-dark); font-weight: 600; text-decoration: none; }
  .sub { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--grey-bg); color: var(--ink-soft); white-space: nowrap; }
  .tag.good { background: rgba(52, 169, 161, .14); color: var(--brand-dark); }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .err { color: var(--stamp-red); }
  @media (max-width: 760px) {
    .hero h1 { font-size: 23px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .controls, .controls label, .controls input { width: 100%; min-width: 0; }
    table.rt thead { display: none; }
    table.rt, table.rt tbody, table.rt tr, table.rt td { display: block; width: 100%; }
    table.rt tr { border-bottom: 1px solid var(--rule); padding: 8px 0; }
    table.rt td { border: 0; padding: 3px 0; text-align: left; }
    table.rt td.num { text-align: left; }
    table.rt td[data-l]::before { content: attr(data-l) ": "; color: var(--ink-soft); font-size: 12px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><a href="/dashboard"><img class="brand-logo" src="/logo.png" alt="ComplyGlobally" width="38" height="38"><span class="brand-text"><span class="brand-name">Compliance Calendar</span><span class="brand-by">by <b>ComplyGlobally</b></span></span></a></div>
  <div class="nav-links" id="navLinks">
    <a href="/dashboard">Dashboard</a>
    <a href="/pipeline">Pipeline</a>
    <a href="/leads" class="active">Leads</a>
    <a href="/reports">Reports</a>
    <a href="/review">Review Queue</a>
  </div>
  <div class="nav-user">
    <span id="navUser"></span>
    <button type="button" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <div>
      <h1>Leads</h1>
      <p>Everyone who generated a compliance calendar on the website, newest first. Each one was emailed their calendar and given a portal login.</p>
    </div>
    <div class="controls">
      <label>Search
        <input type="search" id="searchIn" placeholder="Name, email, phone, company or state" autocomplete="off">
      </label>
      <label>Show
        <select id="showSel">
          <option value="all">All leads</option>
          <option value="new">Never signed in</option>
          <option value="signedin">Signed in</option>
          <option value="services">Chose a service</option>
        </select>
      </label>
    </div>
  </div>
  <div id="root"><p class="muted" style="margin-top:30px;">Loading…</p></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function fmtDate(d) { return d ? new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }
  function fmtTime(d) { return d ? new Date(d).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : ''; }

  var data = null;
  var timer = null;

  function shown() {
    var show = $('showSel').value;
    return data.leads.filter(function (l) {
      if (show === 'new') return !l.signedInAt;
      if (show === 'signedin') return Boolean(l.signedInAt);
      if (show === 'services') return l.servicesChosen > 0;
      return true;
    });
  }

  function statusTag(l) {
    if (l.paid) return '<span class="tag good">Paid for ' + esc(l.paid) + '</span>';
    if (l.servicesChosen) return '<span class="tag good">Chose ' + esc(l.servicesChosen) + ' service' + (l.servicesChosen === 1 ? '' : 's') + '</span>';
    if (l.signedInAt) return '<span class="tag good">Signed in ' + esc(fmtDate(l.signedInAt)) + '</span>';
    return '<span class="tag">Not signed in yet</span>';
  }

  function render() {
    var c = data.counts;
    var rows = shown();
    var kpis = '<div class="kpis">' +
      [['Total leads', c.total], ['Last 7 days', c.lastWeek], ['Signed in', c.signedIn], ['Chose a service', c.choseServices]]
        .map(function (k) { return '<div class="kpi"><div class="l">' + esc(k[0]) + '</div><div class="v">' + esc(k[1]) + '</div></div>'; }).join('') +
      '</div>';
    if (!data.leads.length) {
      $('root').innerHTML = kpis + '<p class="muted" style="margin-top:24px;">' + ($('searchIn').value.trim() ? 'No leads match that search.' : 'No one has generated a calendar on the website yet.') + '</p>';
      return;
    }
    var table = '<div class="box"><table class="rt"><thead><tr>' +
      '<th>Generated</th><th>Name</th><th>Contact</th><th>Company</th><th class="num">Filings</th><th>Status</th><th></th>' +
      '</tr></thead><tbody>' +
      rows.map(function (l) {
        var where = [l.state, l.country !== 'United States' ? l.country : ''].filter(Boolean).join(', ');
        return '<tr>' +
          '<td data-l="Generated">' + esc(fmtDate(l.generatedAt)) + '<div class="sub">' + esc(fmtTime(l.generatedAt)) + '</div></td>' +
          '<td data-l="Name">' + esc(l.name || '—') + '</td>' +
          '<td data-l="Contact"><a href="mailto:' + esc(l.email) + '">' + esc(l.email) + '</a>' +
            (l.phone ? '<div class="sub"><a href="tel:' + esc(l.phone.replace(/[^\d+]/g, '')) + '">' + esc(l.phone) + '</a></div>' : '') + '</td>' +
          '<td data-l="Company">' + esc(l.company || '—') + '<div class="sub">' + esc([where, l.entityType].filter(Boolean).join(' · ')) + '</div></td>' +
          '<td data-l="Filings" class="num">' + esc(l.filings) + '</td>' +
          '<td data-l="Status">' + statusTag(l) + '</td>' +
          '<td><a href="/calendar?id=' + encodeURIComponent(l.calendarId) + '">Open calendar</a></td>' +
          '</tr>';
      }).join('') +
      '</tbody></table></div>';
    var note = rows.length ? '' : '<p class="muted" style="margin-top:12px;">No leads in this view.</p>';
    if (data.truncated) note += '<p class="muted" style="margin-top:12px;">Showing the newest ' + esc(data.leads.length) + '. Search to find older leads.</p>';
    $('root').innerHTML = kpis + table + note;
  }

  function load() {
    var q = $('searchIn').value.trim();
    fetch('/api/leads' + (q ? '?q=' + encodeURIComponent(q) : ''), { credentials: 'same-origin' })
      .then(function (res) { return res.json().then(function (d) { if (!res.ok) throw new Error(d.error || 'Couldn’t load leads.'); return d; }); })
      .then(function (d) { data = d; render(); })
      .catch(function (err) { $('root').innerHTML = '<p class="err" style="margin-top:30px;">' + esc(err.message) + '</p>'; });
  }

  $('searchIn').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(load, 300); });
  $('showSel').addEventListener('change', function () { if (data) render(); });

  fetch('/api/auth/me', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
    var u = d.user || {};
    $('navUser').textContent = u.email || '';
    if (u.role === 'admin' || u.role === 'super_admin') $('navLinks').insertAdjacentHTML('beforeend', '<a href="/admin">Admin</a>');
  }).catch(function () {});
  $('logoutBtn').addEventListener('click', function () {
    fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }).then(function () { location.href = '/login'; });
  });
  load();
})();
</script>
<script src="/js/notifications.js" defer></script>
</body>
</html>
