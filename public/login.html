<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Compliance Calendar Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,72,400;0,72,500;0,72,600;1,72,400;1,72,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<div class="topbar">
  <div class="brand">Compliance Calendar <strong>Generator</strong></div>
</div>

<div class="wrap narrow">
  <div class="card">
    <div class="card-head">
      <div class="card-eyebrow">Internal Tool · Sign In Required</div>
      <h1>Log in</h1>
      <p class="sub">Sign in to generate calendars, review the queue, and download approved PDFs.</p>
    </div>
    <div class="card-body">
      <form id="loginForm">
        <div class="grid full">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>
          </div>
        </div>
        <div class="submit-row">
          <span class="hint" id="statusHint"></span>
          <button type="submit" class="primary" id="submit">Log in →</button>
        </div>
      </form>
      <div class="form-foot" style="margin-top: 16px; text-align: center;">
        <a href="/api/auth/google" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 1px solid #d0d0d0; border-radius: 6px; text-decoration: none; color: inherit;">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('submit');
  const hint = document.getElementById('statusHint');

  const params = new URLSearchParams(location.search);
  const REASON_MESSAGES = {
    session_expired: 'Session expired — please log in again.',
    google_denied: 'Google sign-in was cancelled.',
    google_invalid_state: 'Google sign-in failed — please try again.',
    google_failed: 'Google sign-in failed — please try again.',
    account_deactivated: 'This account has been deactivated. Contact an admin.',
    pending_approval: 'Your account was created and is awaiting admin approval.',
    not_authorized: 'You don\u2019t have access to that page.',
  };
  const reason = params.get('reason');
  if (reason && REASON_MESSAGES[reason]) {
    hint.textContent = REASON_MESSAGES[reason];
    hint.classList.add(reason === 'pending_approval' ? '' : 'err');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    hint.classList.remove('err');
    hint.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Login failed.');
      // Respect an explicit ?next= (e.g. bounced off a protected page),
      // otherwise land clients in the portal and everyone else in the
      // staff app — a client redirected to /app.html would just get
      // bounced straight back out by requirePageRole anyway.
      const dest = params.get('next') || (data.user.role === 'client' ? '/portal.html' : '/app.html');
      location.href = dest;
    } catch (err) {
      hint.textContent = err.message;
      hint.classList.add('err');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
