<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal — ComplyGlobally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  .status-pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:500; }
  .status-Not-Started { background:var(--grey-bg); color:var(--grey-dot); }
  .status-Awaiting-Documents { background:var(--seal-gold-bg); color:var(--seal-gold); }
  .status-Under-Review { background:var(--teal-bg); color:var(--teal); }
  .status-Filed { background:var(--teal-bg); color:var(--teal); }
  .status-Overdue { background:var(--stamp-red-bg); color:var(--stamp-red); }
  .item-row { border-bottom:1px solid var(--rule); padding:16px 0; }
  .item-row:last-child { border-bottom:none; }
  .doc-chip { display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:4px 10px; border:1px solid var(--rule); border-radius:999px; margin:4px 6px 0 0; text-decoration:none; color:var(--ink); }
  .pay-btn { display:inline-block; padding:8px 16px; border-radius:6px; background:var(--teal); color:#fff; font-size:13px; font-weight:600; border:none; cursor:pointer; }
  .pay-btn:disabled { opacity:0.6; cursor:default; }
  .pay-note { font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .upload-locked { font-size:13px; color:var(--ink-soft); }
</style>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<div class="topbar">
  <div class="brand">ComplyGlobally <strong>Client Portal</strong></div>
  <div class="nav-user" id="navUser"></div>
</div>

<div class="wrap">
  <div class="page-grid">
    <div class="main-col">
      <div class="card" style="margin-top:36px;">
        <div class="card-head" style="padding-bottom:20px;">
          <div class="card-eyebrow">Your Compliance Calendar</div>
          <h1 id="calTitle">Loading…</h1>
          <p class="sub" id="calSub"></p>
        </div>
      </div>

      <div id="itemsList" style="margin-top:24px;"><div class="empty-state">Loading…</div></div>
    </div>
    <div class="side-col">
      <div id="contactPanel"></div>
      <div id="chatPanel"></div>
    </div>
  </div>
</div>

<script>
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
  function statusClass(s) { return 'status-' + (s || '').replace(/\s+/g, '-'); }

  let calendar = null;
  let me = null;
  const expandedItems = new Set(); // idx of items currently expanded — persists across re-renders

  async function loadUser() {
    try {
      const res = await fetch('/api/auth/me');
      if (!res.ok) { location.href = '/login.html?next=/portal.html'; return; }
      const { user } = await res.json();
      if (user.role !== 'client') { location.href = '/app.html'; return; }
      me = user;
      const el = document.getElementById('navUser');
      el.innerHTML = `<span>${escapeHtml(user.name || user.email)}</span><button id="logoutBtn">Log out</button>`;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/login.html';
      });
    } catch (err) {
      location.href = '/login.html';
    }
  }

  // ---- Contact: who to reach at ComplyGlobally ----
  async function loadContact() {
    const el = document.getElementById('contactPanel');
    try {
      const res = await fetch('/api/portal/contact');
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { el.innerHTML = ''; return; }
      const person = data.yourContact;
      const company = data.company || {};
      el.innerHTML = `
        <div class="list-section" style="margin-top:32px;">
          <div class="section-title">Your contact at ComplyGlobally</div>
          <div class="contact-grid">
            <div class="contact-card">
              <div class="contact-card-label">${person ? 'Your account contact' : 'General support'}</div>
              <div class="contact-card-row">${escapeHtml(person ? (person.name || person.email) : company.name || 'ComplyGlobally')}</div>
              <div class="contact-card-row">${(person ? person.email : company.email) ? `<a href="mailto:${escapeHtml(person ? person.email : company.email)}">${escapeHtml(person ? person.email : company.email)}</a>` : '—'}</div>
              ${!person && company.phone ? `<div class="contact-card-row">${escapeHtml(company.phone)}</div>` : ''}
            </div>
          </div>
        </div>`;
    } catch (err) {
      el.innerHTML = '';
    }
  }

  // ---- Chat: message the ComplyGlobally team directly ----
  async function loadChat() {
    const el = document.getElementById('chatPanel');
    if (!el || !me || !me.clientOrgId) return;
    el.innerHTML = `
      <div class="list-section" style="margin-top:32px;">
        <div class="section-title">Messages</div>
        <div class="section-sub">Questions about a filing, a document, or anything else — send them here instead of email so everything stays in one place.</div>
        <div class="chat-box">
          <div class="chat-thread" id="chatThread"><div class="empty-state">Loading…</div></div>
          <div class="chat-compose">
            <textarea id="chatInput" placeholder="Write a message…"></textarea>
            <button class="primary" id="chatSendBtn">Send</button>
          </div>
          <span class="hint" id="chatHint" style="display:block;padding:0 18px 12px;"></span>
        </div>
      </div>`;
    document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendChatMessage();
    });
    await refreshChatThread();
  }

  async function refreshChatThread() {
    const thread = document.getElementById('chatThread');
    if (!thread) return;
    try {
      const res = await fetch(`/api/messages/${me.clientOrgId}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Could not load messages.');
      const messages = data.messages || [];
      if (!messages.length) {
        thread.innerHTML = '<div class="empty-state">No messages yet — send the first one.</div>';
        return;
      }
      thread.innerHTML = messages.map(m => `
        <div class="chat-msg ${m.senderRole === 'client' ? 'from-client' : 'from-staff'}">
          <div class="chat-msg-meta">${escapeHtml(m.senderName)} · ${new Date(m.createdAt).toLocaleString()}${m.itemLabel ? ` · <span class="chat-tag">${escapeHtml(m.itemLabel)}</span>` : ''}</div>
          <div class="chat-msg-body">${escapeHtml(m.body)}</div>
        </div>`).join('');
      thread.scrollTop = thread.scrollHeight;
    } catch (err) {
      thread.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
    }
  }

  async function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const hint = document.getElementById('chatHint');
    const text = input.value.trim();
    if (!text) return;
    hint.textContent = 'Sending…'; hint.classList.remove('err');
    try {
      const res = await fetch(`/api/messages/${me.clientOrgId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: text }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Could not send.');
      input.value = '';
      hint.textContent = '';
      await refreshChatThread();
    } catch (err) {
      hint.textContent = err.message; hint.classList.add('err');
    }
  }

  async function loadCalendar() {
    const res = await fetch('/api/portal/calendars');
    const data = await res.json().catch(() => ({}));
    const calendars = data.calendars || [];

    if (!calendars.length) {
      // No approved calendar yet — check for one still under review
      // before assuming there's genuinely nothing (e.g. a client who
      // just signed in via "Start Filing" from the public calendar).
      const pendingRes = await fetch('/api/portal/calendars/pending');
      const pendingData = await pendingRes.json().catch(() => ({}));
      const pending = (pendingData.calendars || [])[0];

      if (pending) {
        document.getElementById('calTitle').textContent = pending.profile.companyName || 'Your compliance calendar';
        document.getElementById('calSub').textContent =
          `${pending.profile.entityType || ''} · ${pending.profile.state || ''} · Submitted ${new Date(pending.createdAt).toLocaleDateString()}`;
        document.getElementById('itemsList').innerHTML = `
          <div class="card"><div class="card-body" style="padding:28px;">
            <div style="font-weight:600;margin-bottom:6px;">⏳ Under review by our compliance team</div>
            <p style="font-size:14px;color:var(--ink-soft);margin:0;">
              We received your ${escapeHtml(String(pending.items?.length || ''))}-item compliance calendar and our team
              is verifying it before document upload opens. This is usually quick — we'll notify you the moment it's ready.
            </p>
          </div></div>`;
        return;
      }

      document.getElementById('calTitle').textContent = 'No calendar yet';
      document.getElementById('calSub').textContent = 'Your compliance calendar will appear here once ComplyGlobally has generated and approved it.';
      document.getElementById('itemsList').innerHTML = '';
      return;
    }
    calendar = calendars[0]; // most recently approved
    document.getElementById('calTitle').textContent = calendar.profile.companyName || 'Your compliance calendar';
    document.getElementById('calSub').textContent =
      `${calendar.profile.entityType || ''} · ${calendar.profile.state || ''} · FY ${calendar.profile.fyStart || ''}–${calendar.profile.fyEnd || ''}`;
    renderItems();
  }

  // Cookie-based auth (see middleware/auth.js) — no Authorization header
  // needed, fetch() sends the session cookie automatically same-origin.
  async function payForItem(idx, btn) {
    const el = document.getElementById('itemsList');
    const hint = el.querySelector(`[data-hint-idx="${idx}"]`);
    btn.disabled = true;
    hint.textContent = ''; hint.classList.remove('err');
    try {
      const orderRes = await fetch(`/api/portal/payments/calendars/${calendar._id}/items/${idx}/create-order`, { method: 'POST' });
      const order = await orderRes.json();
      if (!orderRes.ok) throw new Error(order.error || 'Could not start payment.');

      const options = {
        key: order.keyId,
        amount: order.amount,
        currency: order.currency,
        name: 'ComplyGlobally',
        description: 'Compliance filing fee',
        order_id: order.orderId,
        handler: async function (response) {
          hint.textContent = 'Confirming payment…';
          try {
            const verifyRes = await fetch(`/api/portal/payments/calendars/${calendar._id}/items/${idx}/verify`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(response),
            });
            const result = await verifyRes.json();
            if (!verifyRes.ok) throw new Error(result.error || 'Payment verification failed.');
            calendar = result.calendar;
            renderItems();
          } catch (err) {
            hint.textContent = `${err.message} — if you were charged, contact support.`;
            hint.classList.add('err');
            btn.disabled = false;
          }
        },
        modal: {
          // If the client closes the Razorpay popup without paying,
          // re-enable the button rather than leaving it stuck disabled.
          ondismiss: function () { btn.disabled = false; },
        },
        theme: { color: '#34A9A1' },
      };

      const rzp = new Razorpay(options);
      rzp.on('payment.failed', function (response) {
        hint.textContent = `Payment failed: ${response.error.description}`;
        hint.classList.add('err');
        btn.disabled = false;
      });
      rzp.open();
    } catch (err) {
      hint.textContent = err.message; hint.classList.add('err');
      btn.disabled = false;
    }
  }

  function renderItems() {
    const el = document.getElementById('itemsList');
    if (!calendar.items.length) { el.innerHTML = '<div class="empty-state">No items on this calendar.</div>'; return; }
    const sharedDocumentIndex = calendar.sharedDocumentIndex || {};

    el.innerHTML = `<div class="card"><div class="card-body">` + calendar.items.map((item, idx) => {
      const clientDocs = (item.documents || []).filter(d => d.type === 'client_upload');
      const certs = (item.documents || []).filter(d => d.type === 'certificate');
      const needsPayment = item.paymentStatus === 'Invoiced' || item.paymentStatus === 'Overdue';
      const dollars = item.feeAmountCents ? (item.feeAmountCents / 100).toLocaleString('en-US') : null;
      const isOpen = expandedItems.has(idx);

      // For each required doc: is it uploaded on THIS item, uploaded on
      // a DIFFERENT item already (reuse), or missing entirely. A
      // REJECTED upload never counts as satisfying anything — see the
      // matching fix in routes/portal.routes.js's withRequiredDocuments.
      const required = item.requiredDocuments || [];
      const ownLabels = new Set(clientDocs.filter(d => d.reviewStatus !== 'rejected').map(d => d.requirementLabel));
      const rows = required.map(label => {
        if (ownLabels.has(label)) return { label, state: 'own' };
        const shared = sharedDocumentIndex[label];
        if (shared) return { label, state: 'reused', shared };
        return { label, state: 'missing' };
      });
      const allDocsUploaded = rows.every(r => r.state !== 'missing');
      const doneCount = rows.filter(r => r.state !== 'missing').length;

      const checklistHtml = required.length ? `
        <div style="margin-top:10px;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;">
          <div class="ts" style="font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;">Documents needed</div>
          ${rows.map(r => {
            const done = r.state !== 'missing';
            const reuseNote = r.state === 'reused'
              ? `<div style="font-size:11px;color:var(--teal);margin-left:26px;">Reused from "${escapeHtml(r.shared.compliance_name)}" — no need to upload again</div>`
              : '';
            return `
              <div style="padding:4px 0;">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                  <div style="display:flex;align-items:center;gap:8px;font-size:13px;">
                    <span style="display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;
                      background:${done ? 'var(--teal)' : 'var(--rule)'};color:${done ? '#fff' : 'var(--ink-soft)'};">${done ? '✓' : ''}</span>
                    <span style="${done ? 'color:var(--ink-soft);text-decoration:line-through;' : ''}">${escapeHtml(r.label)}</span>
                  </div>
                  ${done ? '' : `
                    <label class="upload-btn" style="cursor:pointer;font-size:12px;color:var(--teal);white-space:nowrap;">
                      Upload
                      <input type="file" data-idx="${idx}" data-label="${escapeHtml(r.label)}" style="display:none;" class="uploadInput">
                    </label>`}
                </div>
                ${reuseNote}
              </div>`;
          }).join('')}
        </div>` : '';

      const progressLabel = required.length ? `${doneCount}/${required.length} documents ready` : '';

      return `
        <div class="item-row">
          <div class="item-header" data-toggle-idx="${idx}" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;cursor:pointer;">
            <div>
              <div style="font-weight:500;">${escapeHtml(item.compliance_name)}</div>
              <div class="ts" style="color:var(--ink-soft);font-size:13px;margin-top:2px;">Due: ${escapeHtml(item.due_date)}${progressLabel ? ` · ${progressLabel}` : ''}</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              ${item.paymentStatus !== 'Not Invoiced' ? `<span class="status-pill ${item.paymentStatus === 'Paid' ? 'status-Filed' : 'status-Overdue'}">${escapeHtml(item.paymentStatus)}</span>` : ''}
              <span class="status-pill ${statusClass(item.clientStatus)}">${escapeHtml(item.clientStatus)}</span>
              <span style="font-size:12px;color:var(--ink-soft);">${isOpen ? '▲ Hide' : '▼ View & upload'}</span>
            </div>
          </div>

          <div class="item-body" style="${isOpen ? '' : 'display:none;'}margin-top:10px;">
            <p style="font-size:14px;color:var(--ink-soft);margin:8px 0;">${escapeHtml(item.description)}</p>

            ${certs.length ? `<div style="margin-top:8px;">
              <div class="ts" style="font-size:12px;color:var(--ink-soft);">Certificate / acknowledgment</div>
              ${certs.map((d, di) => `<a class="doc-chip" href="/api/portal/calendars/${calendar._id}/items/${idx}/documents/${item.documents.indexOf(d)}/download">${escapeHtml(d.fileName)} ↓</a>`).join('')}
            </div>` : ''}

            ${clientDocs.length ? `<div style="margin-top:8px;">
              <div class="ts" style="font-size:12px;color:var(--ink-soft);">Your uploads</div>
              ${clientDocs.map((d) => {
                const badge = d.reviewStatus === 'accepted'
                  ? `<span class="status-pill status-Filed" style="margin-left:6px;">Accepted</span>`
                  : d.reviewStatus === 'rejected'
                    ? `<span class="status-pill status-Overdue" style="margin-left:6px;">Not accepted</span>`
                    : `<span class="status-pill status-Not-Started" style="margin-left:6px;">Pending review</span>`;
                return `
                  <div style="margin-bottom:6px;">
                    <a class="doc-chip" href="/api/portal/calendars/${calendar._id}/items/${idx}/documents/${item.documents.indexOf(d)}/download">${escapeHtml(d.fileName)} ↓</a>${badge}
                    ${d.reviewStatus === 'rejected' ? `<div style="font-size:12.5px;color:var(--stamp-red);margin:2px 0 0 2px;">${escapeHtml(d.reviewNote || 'Please re-upload a corrected file.')}</div>` : ''}
                  </div>`;
              }).join('')}
            </div>` : ''}

            ${checklistHtml}

            <div style="margin-top:10px;">
              ${needsPayment ? (
                allDocsUploaded
                  ? `<button class="pay-btn" data-idx="${idx}" data-amount="${item.feeAmountCents}">Proceed & pay $${dollars}</button>`
                  : `<button class="pay-btn" disabled style="opacity:0.5;cursor:not-allowed;">Proceed & pay $${dollars}</button>
                     <div class="pay-note">Upload all the documents above to unlock payment.</div>`
              ) : (item.paymentStatus === 'Not Invoiced' && item.clientStatus !== 'Not Started'
                    ? `<div class="pay-note">${escapeHtml(item.feeMessage || "We haven't set a fee for this filing yet — your account contact will let you know once it's ready to invoice.")}</div>`
                    : ``)}
              <span class="hint" data-hint-idx="${idx}"></span>
            </div>
          </div>
        </div>`;
    }).join('') + `</div></div>`;

    el.querySelectorAll('[data-toggle-idx]').forEach(header => {
      header.addEventListener('click', () => {
        const idx = parseInt(header.dataset.toggleIdx, 10);
        if (expandedItems.has(idx)) expandedItems.delete(idx); else expandedItems.add(idx);
        renderItems();
      });
    });

    el.querySelectorAll('.pay-btn').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); payForItem(btn.dataset.idx, btn); });
    });

    el.querySelectorAll('.uploadInput').forEach(input => {
      input.addEventListener('click', (e) => e.stopPropagation());
      input.addEventListener('change', async () => {
        const idx = input.dataset.idx;
        const hint = el.querySelector(`[data-hint-idx="${idx}"]`);
        const file = input.files[0];
        if (!file) return;
        hint.textContent = 'Uploading…'; hint.classList.remove('err');
        const formData = new FormData();
        formData.append('file', file);
        if (input.dataset.label) formData.append('requirementLabel', input.dataset.label);
        try {
          const res = await fetch(`/api/portal/calendars/${calendar._id}/items/${idx}/upload`, { method: 'POST', body: formData });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Upload failed.');
          calendar = data.calendar;
          renderItems();
        } catch (err) {
          hint.textContent = err.message; hint.classList.add('err');
        }
      });
    });
  }

  (async () => {
    await loadUser();
    await loadCalendar();
    await loadContact();
    await loadChat();
  })();
</script>
</body>
</html>
