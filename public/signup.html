<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Compliance Calendar Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,72,400;0,72,500;0,72,600;1,72,400;1,72,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<div class="topbar">
  <div class="brand">Compliance Calendar <strong>Generator</strong></div>
</div>

<div class="wrap narrow">
  <div class="card">
    <div class="card-head">
      <div class="card-eyebrow">Internal Tool · Team Access</div>
      <h1>Create account</h1>
      <p class="sub">Anyone with an account can generate calendars and review/approve teammates' work. Use your work email.</p>
    </div>
    <div class="card-body">
      <form id="signupForm">
        <div class="grid full">
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" autocomplete="name">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="new-password" required minlength="8">
          </div>
        </div>
        <div class="submit-row">
          <span class="hint" id="statusHint">At least 8 characters.</span>
          <button type="submit" class="primary" id="submit">Create account →</button>
        </div>
      </form>
      <div class="form-foot">Already have an account? <a href="/login.html">Log in</a></div>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('signupForm');
  const btn = document.getElementById('submit');
  const hint = document.getElementById('statusHint');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    hint.classList.remove('err');
    hint.textContent = 'Creating account…';
    try {
      const res = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Signup failed.');
      location.href = '/app.html';
    } catch (err) {
      hint.textContent = err.message;
      hint.classList.add('err');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
